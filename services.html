<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Services</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
            color: #333;
            line-height: 1.6;
            margin: 0;
            padding: 50px;
            text-align: center;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        h1 {
            color: #ff6b6b;
            font-size: 2.5rem;
            margin-bottom: 20px;
        }
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .service-card {
            background: rgba(255, 107, 107, 0.05);
            border: 1px solid rgba(255, 107, 107, 0.2);
            padding: 20px;
            border-radius: 10px;
        }
        a {
            display: inline-block;
            margin-top: 30px;
            padding: 10px 20px;
            background-color: #ff6b6b;
            color: #fff;
            text-decoration: none;
            border-radius: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>My Services</h1>
        <p>I offer a variety of design services to help your brand stand out and succeed.</p>
        <div class="services-grid">
            <div class="service-card">
                <h3>Poster Design</h3>
                <p>Eye-catching posters for events and promotions.</p>
            </div>
            <div class="service-card">
                <h3>Social Media Graphics</h3>
                <p>Engaging posts to boost your online presence.</p>
            </div>
            <div class="service-card">
                <h3>Banner Design</h3>
                <p>High-quality banners for web and print.</p>
            </div>
        </div>
        <a href="index.html">Back to Home</a>
    </div>
</body>
</html>
